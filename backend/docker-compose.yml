services:
  api:
    build:
      context: .
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-local-development-only}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1},api
      POSTGRES_DB: ${POSTGRES_DB:-wallpapers}
      POSTGRES_USER: ${POSTGRES_USER:-wallpapers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallpapers}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - media_data:/app/media
      - ./apps/wallpapers/data/images:/app/apps/wallpapers/data/images:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - wallpaper
    restart: unless-stopped
    cpus: ${API_CPUS:-1.5}
    mem_limit: ${API_MEM_LIMIT:-1536m}
    mem_reservation: ${API_MEM_RESERVATION:-512m}
    pids_limit: ${API_PIDS:-256}

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wallpapers}
      POSTGRES_USER: ${POSTGRES_USER:-wallpapers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallpapers}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    cpus: ${DB_CPUS:-1.25}
    mem_limit: ${DB_MEM_LIMIT:-2560m}
    mem_reservation: ${DB_MEM_RESERVATION:-1024m}
    pids_limit: ${DB_PIDS:-256}

volumes:
  postgres_data:
  media_data:

networks:
  wallpaper:
    name: ai_wallpaper_network
