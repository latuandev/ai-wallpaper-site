services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
    container_name: ai-wallpaper-site
    environment:
      BACKEND_API_URL: ${BACKEND_API_URL:-http://api:8000}
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
    ports:
      - "${PORT:-3000}:3000"
    networks:
      - wallpaper
    restart: unless-stopped
    cpus: ${API_CPUS:-0.75}
    mem_limit: ${API_MEM_LIMIT:-1024m}
    mem_reservation: ${API_MEM_RESERVATION:-384m}
    pids_limit: ${API_PIDS:-256}

networks:
  wallpaper:
    name: ai_wallpaper_network
    external: true
